<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>คำต้องห้าม Online</title><style>body{font-family:system-ui;background:#17132d;color:white;margin:0;padding:20px}main{max-width:650px;margin:auto}.panel{background:#292342;padding:22px;border-radius:18px;margin:14px 0}input,button{font:inherit;padding:12px;border:0;border-radius:10px;margin:5px}button{background:#ffd05b;color:#201632;cursor:pointer}input{max-width:90%}.muted{color:#c9bfdc}.word{font-size:38px;font-weight:800}.bad{font-size:23px;color:#ff9caa}#game,#lobby{display:none}</style></head><body><main><h1>🎮 คำต้องห้าม Online</h1><p class="muted">สร้างห้อง แชร์รหัส แล้วเล่นกับเพื่อนแบบเรียลไทม์</p><section class="panel" id="home"><input id="name" placeholder="ชื่อเล่น" maxlength="20"><br><button id="create">สร้างห้อง</button><br><input id="code" placeholder="รหัสห้อง 6 หลัก" maxlength="6"><button id="join">เข้าห้อง</button><p id="notice"></p></section><section class="panel" id="lobby"><h2>ห้อง <span id="roomCode"></span></h2><button id="share">คัดลอกลิงก์ชวนเพื่อน</button><p>ผู้เล่น: <span id="players"></span></p><p>ทีมปัจจุบัน: <b id="team"></b></p><button id="start">เริ่มรอบ (เฉพาะเจ้าของห้อง)</button></section><section class="panel" id="game"><h2>ทีม <span id="playingTeam"></span> | เหลือ <span id="time"></span> วินาที</h2><p class="muted">คนใบ้คำดูการ์ด ห้ามพูดคำสีแดง</p><div class="word" id="word"></div><div class="bad" id="forbidden"></div><p><button id="correct">✓ ตอบถูก +1</button><button id="skip">ข้าม</button><button id="penalty">ผิดกติกา -1</button></p></section><section class="panel"><h2>🏆 คะแนน</h2><p id="scores">ทีม A: 0 | ทีม B: 0</p><p id="status"></p></section><p class="muted">หมายเหตุ: ใช้ Firebase Realtime Database และ Anonymous Authentication</p></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,signInAnonymously} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getDatabase,ref,set,get,onValue,runTransaction} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';
import {firebaseConfig} from './firebase-config.js';
const cards=[['โรงเรียน','ครู','นักเรียน','ห้องเรียน','หนังสือ'],['ฟุตบอล','ลูกบอล','ประตู','สนาม','เตะ'],['โทรศัพท์','โทร','มือถือ','หน้าจอ','แชต'],['แมว','เหมียว','หนวด','สัตว์เลี้ยง','หนู'],['กาแฟ','แก้ว','คาเฟอีน','ดื่ม','ขม'],['ทะเล','น้ำ','คลื่น','ชายหาด','ทราย'],['รถไฟ','สถานี','ราง','ขบวน','ตั๋ว'],['หมูกระทะ','ปิ้ง','ย่าง','หมู','เตา'],['ครู','สอน','โรงเรียน','นักเรียน','กระดาน'],['ช้าง','งวง','ตัวใหญ่','งา','ป่า'],['ฝน','ตก','ร่ม','เปียก','เมฆ'],['คอมพิวเตอร์','เมาส์','คีย์บอร์ด','จอ','พิมพ์'],['ไอศกรีม','เย็น','หวาน','โคน','ละลาย'],['วันเกิด','เค้ก','เทียน','ของขวัญ','อายุ'],['ตลาด','ซื้อ','ขาย','ร้านค้า','ผัก'],['เครื่องบิน','บิน','สนามบิน','นักบิน','ท้องฟ้า']];
const $=id=>document.getElementById(id);let db,auth,uid,room,host=false,state={},ticker;const params=new URLSearchParams(location.search);$('code').value=params.get('room')||'';
try{const app=initializeApp(firebaseConfig);db=getDatabase(app);auth=getAuth(app);const cred=await signInAnonymously(auth);uid=cred.user.uid;}catch(e){$('notice').textContent='ตั้งค่า Firebase ก่อนใช้งาน: '+e.message}
const path=()=>ref(db,'rooms/'+room);const update=changes=>runTransaction(path(),s=>s?{...s,...changes}:s);
async function enter(create){if(!uid)return alert('ยังเชื่อมต่อ Firebase ไม่สำเร็จ');const name=$('name').value.trim();if(!name)return alert('กรุณาใส่ชื่อเล่น');room=create?Math.random().toString(36).slice(2,8).toUpperCase():$('code').value.trim().toUpperCase();if(room.length!==6)return alert('รหัสห้องต้องมี 6 ตัว');let snap=await get(path());if(create){if(snap.exists())return enter(true);await set(path(),{host:uid,players:{[uid]:name},team:'A',scores:{A:0,B:0},round:0,active:false,card:0,endsAt:0});}else{if(!snap.exists())return alert('ไม่พบห้อง');await runTransaction(path(),s=>{if(!s)return;s.players=s.players||{};s.players[uid]=name;return s});}history.replaceState({},'', '?room='+room);$('home').style.display='none';$('lobby').style.display='block';$('roomCode').textContent=room;onValue(path(),snap=>{if(!snap.exists())return;state=snap.val();host=state.host===uid;$('players').textContent=Object.values(state.players||{}).join(', ');$('team').textContent=state.team;$('start').disabled=!host||state.active;$('scores').textContent=`ทีม A: ${state.scores?.A||0} | ทีม B: ${state.scores?.B||0}`;$('game').style.display=state.active?'block':'none';$('playingTeam').textContent=state.team;const card=cards[state.card%cards.length];$('word').textContent=card[0];$('forbidden').textContent=card.slice(1).join(' • ');$('correct').disabled=$('skip').disabled=$('penalty').disabled=!host;$('status').textContent=state.active?'กำลังแข่งขัน':`รอบที่ ${state.round||0} จบแล้ว — เจ้าของห้องเริ่มรอบถัดไปได้`;tick();});clearInterval(ticker);ticker=setInterval(tick,300);}
function tick(){if(!state.active)return;$('time').textContent=Math.max(0,Math.ceil((state.endsAt-Date.now())/1000));if(host&&Date.now()>=state.endsAt)update({active:false,team:state.team==='A'?'B':'A'});}
$('create').onclick=()=>enter(true);$('join').onclick=()=>enter(false);$('share').onclick=async()=>{const url=location.origin+location.pathname+'?room='+room;try{await navigator.clipboard.writeText(url);alert('คัดลอกลิงก์แล้ว')}catch{prompt('คัดลอกลิงก์',url)}};$('start').onclick=()=>{if(!host)return;update({active:true,endsAt:Date.now()+60000,round:(state.round||0)+1,card:Math.floor(Math.random()*cards.length)})};async function next(delta){if(!host||!state.active)return;await runTransaction(path(),s=>{if(!s||!s.active||Date.now()>=s.endsAt)return;s.scores[s.team]=(s.scores[s.team]||0)+delta;s.card=(s.card+1+Math.floor(Math.random()*(cards.length-1)))%cards.length;return s})}$('correct').onclick=()=>next(1);$('skip').onclick=()=>next(0);$('penalty').onclick=()=>next(-1);
</script></body></html>
